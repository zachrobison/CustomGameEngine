name: Build & Release

# Compiles ready-to-play builds on real macOS and Windows machines and publishes
# them to the repo's Releases page. Players just download, unzip, and double-click
# — no compiler, CMake, or libraries to install.
#
# Trigger a release by pushing a version tag:   git tag v1.0 && git push origin v1.0
# Or run it manually from the Actions tab (produces downloadable artifacts).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── macOS: universal (Apple Silicon + Intel) .app bundle ────────────────────
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release -j3
      - name: Package Iron Command.app
        run: |
          APP="Iron Command.app"
          mkdir -p "$APP/Contents/MacOS"
          cp build/VoxelEngine "$APP/Contents/MacOS/"
          cp -R build/assets build/shaders "$APP/Contents/MacOS/"
          cp -R content "$APP/Contents/MacOS/content"
          printf 'ironcommand\n' > "$APP/Contents/MacOS/boot.txt"
          cp packaging/Info.plist "$APP/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "IronCommand-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: IronCommand-macOS
          path: IronCommand-macOS.zip

  # ── Windows: standalone .exe (static CRT + static GLEW, GLFW baked in) ───────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GLEW (static)
        run: vcpkg install glew:x64-windows-static
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          $D = "IronCommand-Windows"
          New-Item -ItemType Directory -Force -Path $D | Out-Null
          Copy-Item build/Release/VoxelEngine.exe "$D/Iron Command.exe"
          Copy-Item -Recurse build/Release/assets  $D/assets
          Copy-Item -Recurse build/Release/shaders $D/shaders
          Copy-Item -Recurse content               $D/content
          "ironcommand" | Out-File -Encoding ascii $D/boot.txt
          Compress-Archive -Path "$D/*" -DestinationPath IronCommand-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: IronCommand-Windows
          path: IronCommand-Windows.zip

  # ── Publish both downloads to a GitHub Release (tag pushes only) ─────────────
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          generate_release_notes: true
          body: |
            **Just download, unzip, and play — no setup.**

            - **Windows:** download `IronCommand-Windows.zip`, unzip, double-click `Iron Command.exe`.
              (First launch: Windows SmartScreen may warn — click *More info → Run anyway*.)
            - **macOS:** download `IronCommand-macOS.zip`, unzip, then **right-click `Iron Command.app` → Open** the first time (it's unsigned).

            LAN free-for-all: one player hosts, others Join by the host's LAN IP.
